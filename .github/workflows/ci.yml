name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  flutter:
    name: App Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build -d
      - run: flutter analyze
      - run: flutter test

  functions:
    name: Cloud Functions et règles
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx --yes firebase-tools@15 emulators:exec --project demo-zaka --only firestore,storage "npm run test:rules"
      - name: Parcours complets (Auth, Firestore, Storage, Functions)
        run: npx --yes firebase-tools@15 emulators:exec --project demo-zaka --only auth,firestore,storage,functions "npx vitest run test/integration --testTimeout=30000 --hookTimeout=30000"
