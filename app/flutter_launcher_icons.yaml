# Icône de l'app, générée par : dart run flutter_launcher_icons
# Sources dans branding/ (logo ZAKA en blanc sur le vert de la marque).
flutter_launcher_icons:
  image_path: "branding/launcher_icon.png"
  android: true
  min_sdk_android: 23
  adaptive_icon_background: "#0B4A3C"
  adaptive_icon_foreground: "branding/launcher_foreground.png"
  adaptive_icon_monochrome: "branding/launcher_foreground.png"
  ios: false
  web:
    generate: true
    image_path: "branding/launcher_icon.png"
    background_color: "#0B4A3C"
    theme_color: "#0B4A3C"
